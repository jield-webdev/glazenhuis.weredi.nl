services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: glazenhuis
      MARIADB_USER: glazenhuis
      MARIADB_PASSWORD: local-development-only
      MARIADB_ROOT_PASSWORD: local-root-only
    ports: ['127.0.0.1:3310:3306']
    volumes: [database:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 20
volumes:
  database:
