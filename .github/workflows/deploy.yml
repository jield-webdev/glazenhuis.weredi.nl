name: Test and deploy to Azure

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run typecheck
      - name: Build Azure packages
        run: npm run build
        env:
          CMS_PUBLIC_URL: ${{ vars.AZURE_CMS_PUBLIC_URL }}
          SITE_URL: ${{ vars.AZURE_SITE_URL }}
          CONTENT_MODE: cms
          APP_KEYS: ci-build-only-1,ci-build-only-2
          ADMIN_JWT_SECRET: ci-build-only-secret
          API_TOKEN_SALT: ci-build-only-salt
          TRANSFER_TOKEN_SALT: ci-build-only-transfer
          ENCRYPTION_KEY: ci-build-only-encryption

      - name: Package both services with Linux runtime dependencies
        run: bash deploy/azure/package.sh "$RUNNER_TEMP/azure-packages"
      - uses: actions/upload-artifact@v4
        with:
          name: azure-packages
          path: ${{ runner.temp }}/azure-packages/*.zip
          if-no-files-found: error
          retention-days: 7

  verify-cms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: glazenhuis_test
          MARIADB_USER: glazenhuis_test
          MARIADB_PASSWORD: integration-only
          MARIADB_ROOT_PASSWORD: integration-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: glazenhuis_test
      DATABASE_USERNAME: glazenhuis_test
      DATABASE_PASSWORD: integration-only
      INTEGRATION_TEST: 'true'
      SEED_CONTENT: 'true'
      STRAPI_TELEMETRY_DISABLED: 'true'
      CONTENT_MODE: demo
      APP_KEYS: ci-only-one,ci-only-two
      ADMIN_JWT_SECRET: ci-only-secret
      API_TOKEN_SALT: ci-only-salt
      TRANSFER_TOKEN_SALT: ci-only-transfer
      ENCRYPTION_KEY: ci-only-key
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run test:integration

  deploy:
    needs: [ verify, verify-cms ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azure-packages
          path: packages
      - name: Check deployment configuration
        env:
          WEB_APP: ${{ vars.AZURE_WEBAPP_NAME }}
          CMS_APP: ${{ vars.AZURE_CMS_APP_NAME }}
        run: |
          : "${WEB_APP:?Set AZURE_WEBAPP_NAME in azure-production}"
          : "${CMS_APP:?Set AZURE_CMS_APP_NAME in azure-production}"
          test "$WEB_APP" != "$CMS_APP"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy CMS
        id: cms
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_CMS_APP_NAME }}
          package: packages/cms.zip
          startup-command: bash /home/site/wwwroot/start.sh
      - name: Check CMS readiness
        env:
          APP_URL: ${{ steps.cms.outputs.webapp-url }}
        run: curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 5 --max-time 15 "${APP_URL%/}/_health"
      - name: Deploy website
        id: web
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: packages/web.zip
          startup-command: bash /home/site/wwwroot/start.sh
      - name: Check website and CMS connectivity
        env:
          APP_URL: ${{ steps.web.outputs.webapp-url }}
        run: curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 5 --max-time 15 "${APP_URL%/}/api/health"
