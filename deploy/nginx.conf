# Start with this HTTP configuration, then: certbot --nginx -d glazenhuis.weredi.nl
server {
 listen 80;
 listen [::]:80;
 server_name glazenhuis.weredi.nl;
 client_max_body_size 11m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;

 # Create first admin through CLI before opening nginx. Invitations use register with a token.
 location = /cms/admin/register-admin { return 403; }
 location = /cms/admin/init { proxy_pass http://127.0.0.1:3006/admin/init; }
 location /cms/ {
  proxy_pass http://127.0.0.1:3006/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
  add_header X-Robots-Tag "noindex, nofollow" always;
 }
 location /uploads/ {
  alias /var/lib/glazenhuis/shared/uploads/;
  autoindex off;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'none'; sandbox" always;
 }
 location / {
  proxy_pass http://127.0.0.1:3005;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
}
